services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: vendorproof
      POSTGRES_USER: vendorproof
      POSTGRES_PASSWORD: local-dev-password
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U vendorproof -d vendorproof"]
      interval: 5s
      timeout: 3s
      retries: 10
volumes:
  postgres_data:
